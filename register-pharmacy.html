<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل صيدلية جديدة - صيدليتي</title>
    <!-- استدعاء مكتبة Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- خط Cairo العربي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- شريط التنقل العلوي -->
    <header class="bg-teal-700 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2 space-x-reverse">
                <a href="index.html" class="text-2xl font-bold">🩺 صيدليتي</a>
            </div>
            <div>
                <a href="index.html" class="text-teal-100 hover:text-white text-sm font-semibold">← العودة للرئيسية</a>
            </div>
        </div>
    </header>

    <!-- محتوى صفحة التسجيل -->
    <main class="container mx-auto px-4 py-10 max-w-2xl">
        <div class="bg-white p-8 rounded-2xl shadow-md border border-gray-100">
            
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-teal-800">انضم إلينا كصيدلي معتمد</h1>
                <p class="text-gray-500 text-sm mt-2">سجل صيدليتك الآن لتبدأ باستقبال طلبات المرضى في مدينتك</p>
            </div>

            <form class="space-y-5" onsubmit="event.preventDefault(); alert('تم إرسال طلب تسجيل صيدليتك بنجاح! سيتم مراجعة البيانات وتفعيل الحساب قريباً.'); window.location.href='dashboard.html';">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">اسم الصيدلية</label>
                        <input type="text" required placeholder="مثال: صيدلية الشفاء" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-teal-700">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">اسم الصيدلي المسؤول</label>
                        <input type="text" required placeholder="الدكتور / الصيدلي..." class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-teal-700">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">رقم الهاتف الرسمي</label>
                        <input type="tel" required placeholder="07700000000" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-teal-700">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">المحافظة</label>
                        <select class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-teal-700">
                            <option>بغداد</option>
                            <option>البصرة</option>
                            <option>أربيل</option>
                            <option>النجف الأشرف</option>
                            <option>كربلاء المقدسة</option>
                            <option>الموصل</option>
                            <option>بقية المحافظات...</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">العنوان التفصيلي للصيدلية</label>
                    <input type="text" required placeholder="المنطقة، الشارع الرئيسي، قرب..." class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-teal-700">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">كلمة المرور للوحة التحكم</label>
                        <input type="password" required placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-teal-700">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">رقم إجازة الصيدلية (رخصة مزاولة المهنة)</label>
                        <input type="text" required placeholder="رقم الرخصة الرسمية" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-teal-700">
                    </div>
                </div>

                <button type="submit" class="w-full bg-teal-700 text-white py-3 rounded-xl font-bold hover:bg-teal-800 transition text-lg shadow-md mt-4">إرسال طلب الانضمام</button>
            </form>

        </div>
    </main>

    <!-- تذييل الصفحة -->
    <footer class="bg-gray-800 text-white text-center py-4 text-sm mt-12">
        <p>جميع الحقوق محفوظة © 2026 - تطبيق صيدليتي</p>
    </footer>

</body>
</html>
